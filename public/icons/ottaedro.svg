<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bicoccaGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C42649" />
      <stop offset="100%" stop-color="#A71E3B" />
    </linearGradient>
    <linearGradient id="bicoccaGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A71E3B" />
      <stop offset="100%" stop-color="#730723" />
    </linearGradient>
    <linearGradient id="bicoccaGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#730723" />
      <stop offset="100%" stop-color="#550317" />
    </linearGradient>
    <linearGradient id="bicoccaGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D83424" />
      <stop offset="100%" stop-color="#A71E3B" />
    </linearGradient>
  </defs>

  <!-- Back Facets (Subtle Depth) -->
  <polygon points="50,6 12,50 50,36" fill="#730723" opacity="0.35" />
  <polygon points="50,6 88,50 50,36" fill="#A71E3B" opacity="0.3" />
  <polygon points="50,94 12,50 50,36" fill="#550317" opacity="0.4" />
  <polygon points="50,94 88,50 50,36" fill="#730723" opacity="0.35" />

  <!-- Front Facets (Illuminated) -->
  <polygon points="50,6 12,50 50,64" fill="url(#bicoccaGrad1)" opacity="0.9" stroke="#FFF" stroke-opacity="0.15" stroke-width="0.8" />
  <polygon points="50,6 88,50 50,64" fill="url(#bicoccaGrad4)" opacity="0.95" stroke="#FFF" stroke-opacity="0.2" stroke-width="0.8" />
  <polygon points="50,94 12,50 50,64" fill="url(#bicoccaGrad2)" opacity="0.9" stroke="#FFF" stroke-opacity="0.15" stroke-width="0.8" />
  <polygon points="50,94 88,50 50,64" fill="url(#bicoccaGrad3)" opacity="0.95" stroke="#FFF" stroke-opacity="0.2" stroke-width="0.8" />

  <!-- Structural Edges (Leonardo Wireframe Lines) -->
  <polyline points="50,6 12,50 50,94 88,50 50,6" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.2" stroke-linejoin="round" />
  <polyline points="12,50 50,64 88,50" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.2" stroke-linejoin="round" />
  <line x1="50" y1="6" x2="50" y2="64" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1.2" />
  <line x1="50" y1="64" x2="50" y2="94" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1.2" />

  <!-- Vertices Accent Dots -->
  <circle cx="50" cy="6" r="1.8" fill="#FFF" />
  <circle cx="50" cy="94" r="1.8" fill="#FFF" />
  <circle cx="12" cy="50" r="1.8" fill="#FFF" />
  <circle cx="88" cy="50" r="1.8" fill="#FFF" />
  <circle cx="50" cy="64" r="2.2" fill="#FFF" />
</svg>
